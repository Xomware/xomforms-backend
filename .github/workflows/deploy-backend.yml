name: Deploy Backend

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      lambdas:
        description: Comma-separated lambda folders to deploy. Empty rebuilds the layer and deploys all.
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: Xomware/github-actions/.github/workflows/deploy-lambda-python.yml@v1
    with:
      app: xomforms
      python-version: '3.12'
      test-command: python -m pytest tests -q
      lambdas: ${{ inputs.lambdas }}
      function-names: |
        responses_submit_authed=xomforms-responses-submit
        responses_submit_public=xomforms-responses-submit-guest
